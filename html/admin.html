<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css" >
    <link rel="stylesheet" href="../css/admin.css" >
    <title>Admin</title>
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <section class="cadastro">
            <h1>Cadastro de usuários:</h1>

            <form>
                <label for="fname">Nome:</label><br>
                <input type="text" id="fname" name="fname"><br>
                <label for="femail">Email:</label><br>
                <input type="text" id="lname" name="lname">

                <button>Cadastrar</button>
            </form> 
        </section>

        <section class="usuarios">
            <div class="listas">
                <form>
                    <input type="text" id="#" name="#" class="pesquisa-input" placeholder="pesquisar">
                    <button>
                        <img src="../icone/magnifying-glass-backup-svgrepo-com.svg" width="25">
                    </button>
                </form> 
                <button>
                    <img src="../icone/trash-xmark-svgrepo-com.svg" width="25">
                </button>
            </div>

            <div class="usuario">
                <div>
                    <p>Nome</p>
                    <p>Email</p>
                    <p>Data</p>
                </div>
                <div>
                    <button><img src="../icone/trash-delete-svgrepo-com.svg" alt="Icone de lixeira" width="50"></button>
                </div>
            </div>

        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="../javascript/renderizar.js"></script>
</body>
</html>
