<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css" >
    <link rel="stylesheet" href="../css/admin.css" >
    <title>Admin</title>
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <section class="cadastro">
            <h1>Cadastro de usuários:</h1>

            <form id="form-cadastro">
                <label for="fname">Nome:</label><br>
                <input type="text" id="fname" name="fname"><br>
                <label for="femail">Email:</label><br>
                <input type="email" id="femail" name="femail"><br>

                <button type="submit">Cadastrar</button>
                <button type="button" id="btn-limpar">Limpar</button>
            </form>
        </section>

        <section class="usuarios">
            <div class="listas">
                <form id="form-pesquisa">
                    <input type="text" id="pesquisa-input" name="pesquisa" class="pesquisa-input" placeholder="pesquisar">
                    <button type="submit">
                        <img src="../icone/magnifying-glass-backup-svgrepo-com.svg" width="25" alt="Pesquisar">
                    </button>
                </form>
                <button type="button" id="btn-excluir-todos">
                    <img src="../icone/trash-xmark-svgrepo-com.svg" width="25" alt="Excluir todos os usuários">
                </button>
            </div>

            <div class="usuario cabecalho">
                <p>Nome</p>
                <p>Email</p>
                <p>Data</p>
            </div>

            <ul id="lista-usuarios" class="lista-usuarios">
                <!-- itens gerados dinamicamente pelo admin.js -->
            </ul>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="../javascript/renderizar.js"></script>
    <script src="../javascript/admin.js"></script>
</body>
</html>
