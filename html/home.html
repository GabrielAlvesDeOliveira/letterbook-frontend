<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css">
    <title>Letterbook web</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../icone/book.svg" alt="Icone da logo" width="50">
            <h1 class="logo-titulo">Letterbook</h1>
        </div>
        <nav class="links">
            <ul class="links">
                <li>
                    <a href="home.html">Home</a>
                </li>
                <li>
                    <a href="wishlist.html">Lista de desejos</a>
                </li>
                <li class="link-admin">
                    <img src="../icone/admin-generic-svgrepo-com.svg" alt="Icone de Admin" width="15">
                    <a href="admin.html">Admin</a>
                </li>
            </ul>
        </nav>
        
    </header>
    <main>
        <h2 class="acervo">Acervo do Letterbook</h2>

        <section class="cards">
            <div class="livro-card">
                <img src="../imagem/alice-pais-maravilhas.jpg" alt="capa do livro" width="200">
                <h3>Título</h3>
                <input type="range" min="0" max="5" step="0.5" value="0">
                <button type="button">
                    <img src="../icone/cart-shopping-svgrepo-com.svg" alt="Adicionar a lista de desejos" width="25">
                </button>
            </div>
        </section>
    </main>
    <footer>
        <p> © 2026 <a href="#">Gabriel</a>&<a href="#">Luigi</a> - Todos os direitos reservados. </p>
    </footer>
</body>
</html>
